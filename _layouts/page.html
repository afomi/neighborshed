---
layout: default
---

<article class="mx-auto max-w-3xl px-6 py-16">
  <header class="mb-12">
    {% if page.kicker %}
    <p class="mb-3 font-mono text-sm font-bold uppercase tracking-widest text-brand-700 dark:text-brand-400">
      {{ page.kicker }}
    </p>
    {% endif %}
    <h1 class="text-4xl font-bold tracking-tight text-neutral-950 sm:text-5xl dark:text-white">
      {{ page.title }}
    </h1>
    {% if page.lede %}
    <p class="mt-6 text-xl/8 text-neutral-700 dark:text-neutral-300">
      {{ page.lede }}
    </p>
    {% endif %}
  </header>
  <div class="doc">
    {{ content }}
  </div>
</article>
