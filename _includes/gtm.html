{% if site.gtm_container_id and site.gtm_container_id != "" %}
<script
  async
  src="https://www.googletagmanager.com/gtm.js?id={{ site.gtm_container_id }}"
></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
{% endif %}
