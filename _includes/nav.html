<header class="border-b border-neutral-200 dark:border-neutral-800">
  <nav
    class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-8 gap-y-2 px-6 py-3"
    aria-label="Main"
  >
    <div class="flex items-center gap-x-6">
      <a
        href="{{ "/" | relative_url }}"
        class="flex items-center gap-x-3 text-lg font-bold no-underline"
      >
        <img
          class="h-7 w-7"
          src="{{ "/assets/img/mark.svg" | relative_url }}"
          alt=""
          width="32"
          height="32"
        >
        <span>{{ site.title }}</span>
      </a>
      <a
        href="{{ "/about/" | relative_url }}"
        class="text-base font-bold {% if page.url == "/about/" %}decoration-4{% else %}no-underline hover:underline{% endif %}"
        {% if page.url == "/about/" %}aria-current="page"{% endif %}
      >
        About
      </a>
    </div>
    <a
      href="{{ site.repository }}"
      class="text-base font-bold no-underline hover:underline"
      data-exit="github"
    >
      GitHub
    </a>
  </nav>
</header>
